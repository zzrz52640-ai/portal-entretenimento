<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Portal de Entretenimento Digital</title>

    <!-- CSS RESET -->
    <link rel="stylesheet" href="reset.css">

    <!-- CSS EXTERNO -->
    <link rel="stylesheet" href="estilo.css">

    <!-- CSS INTERNO -->
    <style>

        body{
            background-color: #121212;
        }

    </style>

</head>

<body>

    <!-- TÍTULO PRINCIPAL -->
    <h1 id="titulo-principal">
        Meu Portal de Entretenimento Digital
    </h1>

    <!-- CONTAINER FLEXBOX -->
    <div class="container">

        <!-- FILMES E SÉRIES -->
        <section class="card">

            <h2 class="titulo-secao">
                Filmes e Séries
            </h2>

            <img class="imagem"
            src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=800&auto=format&fit=crop"
            alt="Cinema">

            <img class="imagem"
            src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=800&auto=format&fit=crop"
            alt="Filmes">

            <p>
                Descubra novos filmes, séries populares
                e lançamentos do streaming.
            </p>

        </section>

        <!-- MÚSICA E PODCASTS -->
        <section class="card">

            <h2 class="titulo-secao">
                Música e Podcasts
            </h2>

            <img class="imagem"
            src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=800&auto=format&fit=crop"
            alt="Música">

            <img class="imagem"
            src="https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?q=80&w=800&auto=format&fit=crop"
            alt="Podcast">

            <!-- CSS INLINE -->
            <p style="color: cyan;">
                Explore músicas, playlists e podcasts
                sobre entretenimento digital.
            </p>

        </section>

        <!-- GAMES E TECNOLOGIA -->
        <section class="card">

            <h2 class="titulo-secao">
                Games e Tecnologia
            </h2>

            <img class="imagem"
            src="https://images.unsplash.com/photo-1542751110-97427bbecf20?q=80&w=800&auto=format&fit=crop"
            alt="Games">

            <img class="imagem"
            src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=800&auto=format&fit=crop"
            alt="Tecnologia">

            <p>
                Fique por dentro das novidades dos games,
                consoles e da tecnologia.
            </p>

        </section>

    </div>

</body>

</html>
